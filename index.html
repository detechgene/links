<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detechgene Links</title>

  <!-- Meta -->
  <meta name="description" content="All our important links in one place" />
  <meta name="author" content="Detechgene GmbH" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --radius: 14px;
      --card-a: rgba(255, 255, 255, 0.88);   /* “white” with opacity */
        --card-b: rgba(216, 223, 231, 0.82);   /* slightly bluish with opacity */

        --btn-a: #99a3b6;                      /* dark navy */
        --btn-b: #111b33;                      /* slightly lighter navy */
        --btn-hover-a: #cddfff;                /* hover */
        --btn-hover-b: #f0f5ff;                /* hover accent */

    }

    * {
      box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--text);

        background:
            url("https://raw.githubusercontent.com/prgprg/detechgene_logo_simple/efa7d88e4a85d6ce5183f5ec2fdbd76a0fe58529/bg.svg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        /* 👇 THIS IS THE FIX */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
}

    .container {
        width: 100%;
        max-width: 520px;

        /* gradient + opacity without fading children */
        /* background: linear-gradient(180deg, var(--card-a), var(--card-b)); */
        background: rgb(246, 249, 255); /* semi-transparent white */

        border-radius: var(--radius);
        padding: 32px 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        text-align: center;

        /* optional: subtle border to look premium */
        border: 1px solid rgba(255, 255, 255, 0.35);

        /* optional: keep blur effect if supported */
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        }

    .logo {
        display: block;
        max-width: 100%;          
        width: min(420px, 100%);  
        height: auto;             
        max-height: 120px;        
        margin: 0 auto 16px;      
        object-fit: contain;
        }


    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 2px solid var(--accent);
    }

    h1 {
      font-size: 1.6rem;
      margin: 0;
      font-weight: 700;
    }

    .bio {
        font-family: 'Sora', 'Inter', system-ui, sans-serif;
        font-weight: bolder;
        font-size: 1.2rem;
        color: #1a3066;
        text-align: center;
        line-height: 1.4;
        margin: 8px 0 38px 0;
        }

    /* ---------- Thumbnail grids ---------- */
    .thumbs {
      display: grid;
      gap: 16px;
      justify-items: center;
    }

    /* Main thumbnails: 4 per row on PC, 2x2 on mobile */
    .thumbs-main {
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: 28px;
    }

    /* Social thumbnails: always 4 in one row, smaller */
    .thumbs-social {
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-top: 22px;
      border-top: 1px solid rgba(26, 48, 102, 0.12);
    }

    .thumb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-decoration: none;
      color: #1a3066;
      font-family: 'Sora', 'Inter', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.78rem;
      line-height: 1.2;
      -webkit-tap-highlight-color: transparent;
    }

    .thumb-box {
      /* ICON PLACEHOLDER: the box shows a dashed outline until an icon loads */
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 96px;
      border-radius: 22%;
      background: linear-gradient(135deg, var(--btn-hover-a), var(--btn-hover-b));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .thumb-box::before {
      content: "";
      position: absolute;
      inset: 22%;
      border: 2px dashed rgba(255, 255, 255, 0.35);
      border-radius: 28%;
    }

    /* hide the placeholder once an icon is present */
    .thumb-box:has(img)::before {
      display: none;
    }

    .thumb-box img {
      width: 52%;
      height: 52%;
      object-fit: contain;
    }

    .thumbs-social .thumb-box {
      max-width: 60px;
    }

    .thumbs-social .thumb {
      font-size: 0.7rem;
      font-weight: 500;
      gap: 6px;
    }

    .thumb:hover .thumb-box,
    .thumb:focus-visible .thumb-box {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 12px 22px rgba(11, 74, 166, 0.35);
    }

    .thumb:focus-visible {
      outline: none;
    }


    footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
        .container {
            padding: 22px 16px;
        }

        .bio {
            font-size: 1.05rem;
            margin: 8px 0 26px 0;
        }

        .thumbs-main {
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 16px;
        }

        .thumbs-main .thumb-box {
            max-width: 120px;
        }

        .thumb {
            font-size: 0.85rem;
        }

        .thumbs-social {
            gap: 8px;
        }
        }

  </style>
</head>
<body>
  <main class="container" >
    <!-- Logo -->
    <img
      class="logo"
      src="https://github.com/prgprg/detechgene_logo_simple/blob/main/Logo_Transparent.png?raw=true"
      alt="logo"
      onerror="this.style.display='none'; document.getElementById('fallback-name').style.display='block';"
    />

    <!-- Fallback text if logo fails -->
    <h1 id="fallback-name" style="display:none;">Detechgene</h1>

    <p class="bio">
      Simple and Precise Detection of Pathogens
    </p>

    <!--
      ICONS: paste the Flaticon image URL into each src="" below.
      While src is empty/invalid the dashed placeholder stays visible.
    -->

    <!-- Main thumbnails -->
    <nav class="thumbs thumbs-main" aria-label="Documents and media">
      <a class="thumb" href="https://detechgene-my.sharepoint.com/:b:/g/personal/a_pourgholami_detechgene_de/IQCpMqt1k7pySa8cpLlxS_XuAf4Y8ptj2kCm5x05zGO27Gs" target="_blank" rel="noopener">
        <span class="thumb-box"><img src="https://cdn-icons-png.flaticon.com/512/13558/13558967.png" alt="" onerror="this.remove()"></span>
        <span>Flyer</span>
      </a>
      <a class="thumb" href="https://detechgene-my.sharepoint.com/:b:/g/personal/a_pourgholami_detechgene_de/IQBm-FohTb92Q5Ds1rSZRZ0UAbeM7IKxPOLtjFLA3XGbRas?e=uzGaBh" target="_blank" rel="noopener">
        <span class="thumb-box"><img src="https://cdn-icons-png.flaticon.com/512/7832/7832362.png" alt="" onerror="this.remove()"></span>
        <span>One Pager</span>
      </a>
      <a class="thumb" href="https://www.youtube.com/watch?v=1F7XxPBQaLY" target="_blank" rel="noopener">
        <span class="thumb-box"><img src="https://cdn-icons-png.flaticon.com/512/656/656444.png" alt="" onerror="this.remove()"></span>
        <span>Product Video</span>
      </a>
      <!-- Awards: opens the website and scrolls to the awards section.
           Change "#awards" to the real section id on detechgene.com -->
      <a class="thumb" href="https://detechgene.com/#awards" target="_blank" rel="noopener">
        <span class="thumb-box"><img src="https://cdn-icons-png.flaticon.com/512/8510/8510267.png" alt="" onerror="this.remove()"></span>
        <span>Media</span>
      </a>
    </nav>

    <!-- Social thumbnails -->
    <nav class="thumbs thumbs-social" aria-label="Website and social media">
      <a class="thumb" href="https://detechgene.com" target="_blank" rel="noopener">
        <span class="thumb-box"><img src="https://cdn-icons-png.flaticon.com/512/4713/4713146.png" alt="" onerror="this.remove()"></span>
        <span>Website</span>
      </a>
      <a class="thumb" href="https://linkedin.com/company/detechgene" target="_blank" rel="noopener">
        <span class="thumb-box"><img src="https://cdn-icons-png.flaticon.com/512/3800/3800073.png" alt="" onerror="this.remove()"></span>
        <span>LinkedIn</span>
      </a>
      <a class="thumb" href="https://www.instagram.com/detechgene/" target="_blank" rel="noopener">
        <span class="thumb-box"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077042.png" alt="" onerror="this.remove()"></span>
        <span>Instagram</span>
      </a>
      <a class="thumb" href="https://www.tiktok.com/@detechgene" target="_blank" rel="noopener">
        <span class="thumb-box"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046125.png" alt="" onerror="this.remove()"></span>
        <span>TikTok</span>
      </a>

    </nav>


  </main>

</body>
</html>
